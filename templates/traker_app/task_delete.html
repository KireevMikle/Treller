{% extends 'base.html' %}

{% block content %}
<div class="delete-container">
  <div class="delete-card">
    <h2>Видалити</h2>
    <p>ви впевнені "{{ object.name }}"?</p>

    <form method="post">
      {% csrf_token %}
      <div class="delete-actions">
        <button type="submit" class="btn-danger">Видалити</button>
        <a href="{% url 'task_list' %}" class="btn-cancel">Відмінити</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
